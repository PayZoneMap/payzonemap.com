<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Which pay zone am I in?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Published US pay zones from each company's own pages, side by side and mapped by county. Pick where you live and see the zone you'd land in.">
<link rel="canonical" href="https://payzonemap.com/">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161c" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PayZoneMap">
<meta property="og:url" content="https://payzonemap.com/">
<meta property="og:title" content="Which pay zone am I in? · PayZoneMap">
<meta property="og:description" content="Published US pay zones from each company's own pages, side by side and mapped by county. Pick where you live and see the zone you'd land in.">
<meta property="og:image" content="https://payzonemap.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The PayZoneMap pin beside the words Which pay zone am I in?, and a US county map shaded by typical pay zone">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://payzonemap.com/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css?v=3d3f7054aa">

</head>
<body>
<main>
  <header class="intro">
    <a class="brandmark" href="/"><img src="/brand/logo.svg" alt="" width="40" height="40"><span>PayZoneMap</span></a>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="searches" role="search">
    <div class="search">
      <label for="place-input" id="place-label"></label>
      <input id="place-input" type="text" autocomplete="off" role="combobox" aria-autocomplete="list"
             aria-expanded="false" aria-controls="place-options">
      <ul class="options" id="place-options" role="listbox" hidden></ul>
      <p class="hint" id="place-hint"></p>
    </div>
    <div class="search">
      <label for="company-input" id="company-label"></label>
      <input id="company-input" type="text" autocomplete="off" role="combobox" aria-autocomplete="list"
             aria-expanded="false" aria-controls="company-options">
      <ul class="options" id="company-options" role="listbox" hidden></ul>
      <p class="hint" id="company-hint"></p>
    </div>
    <div class="search">
      <label for="role-input" id="role-label"></label>
      <input id="role-input" type="search" autocomplete="off" aria-describedby="role-hint">
      <p class="hint" id="role-hint"></p>
    </div>
    <div class="search">
      <label for="amt-input" id="amt-label"></label>
      <input id="amt-input" type="text" inputmode="decimal" autocomplete="off" aria-describedby="amt-hint">
      <p class="hint" id="amt-hint"></p>
    </div>
  </div>
  <p class="searchpay" id="search-pay" aria-live="polite" hidden><span id="search-pay-text"></span> <button type="button" class="linkbtn" id="search-pay-link"></button></p>

  <section class="place company-panel" id="company-panel" aria-labelledby="company-name" hidden>
    <div>
      <div class="where" id="company-kind"></div>
      <h2 id="company-name"></h2>
    </div>
    <ul class="zonelist" id="company-zones"></ul>
    <p class="hint" id="company-meta"></p>
    <p><button type="button" class="linkbtn" id="company-clear"></button></p>
  </section>

  <section class="place" aria-labelledby="place-name">
    <span class="example" id="example-flag" hidden></span>
    <div>
      <div class="where" id="place-kind"></div>
      <h2 id="place-name"></h2>
    </div>
    <div class="facts">
      <div class="fact"><span class="big num" id="fact-all"></span><span class="what" id="fact-all-what"></span></div>
      <div class="fact" id="fact-housing-box"><span class="big num" id="fact-housing"></span><span class="what" id="fact-housing-what"></span></div>
      <div class="fact"><span class="big" id="fact-band"></span><span class="what" id="fact-band-what"></span></div>
      <div class="fact"><span class="big" id="fact-typical"></span><span class="what" id="fact-typical-what"></span></div>
    </div>
  </section>

  <section class="mapsec" aria-labelledby="map-heading">
    <h2 id="map-heading"></h2>
    <div class="mapbar">
      <p class="mapshowing" id="map-showing"></p>
      <ul class="legend" id="legend"></ul>
    </div>
    <div class="mapbox" id="mapbox"><p class="maploading" id="map-loading"></p></div>
    <p class="mapcap" id="map-caption" aria-live="polite"></p>
  </section>

  <section aria-labelledby="table-heading" style="display:grid;gap:0.8rem">
    <h2 id="table-heading"></h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th id="th-co"></th><th id="th-zone"></th><th id="th-why"></th><th id="th-src"></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section class="paysec" id="pay-section" aria-labelledby="pay-heading" hidden>
    <h2 id="pay-heading" tabindex="-1"></h2>
    <p class="hint" id="pay-intro"></p>
    <div class="payfilters">
      <div><label for="pay-where" id="pay-where-label"></label><select id="pay-where"></select></div>
      <div><label for="pay-role" id="pay-role-label"></label><select id="pay-role"></select></div>
      <div><label for="pay-level" id="pay-level-label"></label><select id="pay-level"></select></div>
      <div><label for="pay-covers" id="pay-covers-label"></label><select id="pay-covers"></select></div>
      <div class="grow"><label for="pay-q" id="pay-q-label"></label><input id="pay-q" type="search" autocomplete="off"></div>
      <div><label for="pay-amt" id="pay-amt-label"></label><input id="pay-amt" type="text" inputmode="decimal" autocomplete="off" aria-describedby="pay-amt-hint"></div>
    </div>
    <p class="hint" id="pay-amt-hint"></p>
    <p class="hint" id="pay-amt-note" aria-live="polite"></p>
    <p class="mapcap" id="pay-count" aria-live="polite"></p>
    <p class="hint" id="pay-coverage"></p>
    <details class="paycov" id="pay-coverage-all"><summary id="pay-coverage-summary"></summary><ul id="pay-coverage-list"></ul></details>
    <div class="tablewrap">
      <table class="paytable">
        <thead><tr><th id="pth-job"></th><th id="pth-level"></th><th id="pth-range"></th><th id="pth-covers"></th></tr></thead>
        <tbody id="pay-rows"></tbody>
      </table>
    </div>
    <p><button type="button" class="linkbtn" id="pay-more" hidden></button></p>
  </section>

  <section class="next" aria-labelledby="next-heading">
    <h2 id="next-heading"></h2>
    <ul id="next-list"></ul>
  </section>

  <section class="next" aria-labelledby="covers-heading">
    <h2 id="covers-heading"></h2>
    <ul id="covers-list"></ul>
  </section>

  <section class="next" aria-labelledby="world-heading">
    <h2 id="world-heading"></h2>
    <ul id="world-list"></ul>
  </section>

  <footer class="about" aria-labelledby="about-heading">
    <h2 id="about-heading"></h2>
    <ul id="about-list"></ul>
    <p id="contact"></p>
    <p><a href="https://salesforcegirl.hashnode.dev/zone-a-tier-3-geo-zone-2-which-one-am-i" id="story-link" target="_blank" rel="noopener"></a></p>
    <p><a href="terms.html" id="terms-link"></a></p>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="app.js?v=bc74229643"></script>
<!-- 24 Nov: visit counts, to see which LinkedIn posts send people here
     (utm_campaign, see MyMetrics README "Tagged links"). count.js is GoatCounter's
     own script, kept here so the page runs a pinned copy; it counts once on load,
     before writeHash() can drop the ?utm_ query. The canonical link makes the
     counted path "/", so the #place in the address is never sent. -->
<script data-goatcounter="https://payzonemap.goatcounter.com/count" async src="count.js?v=792b7abd26"></script>
</body>
</html>
